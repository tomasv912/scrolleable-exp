<title>Percepta Concepts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a quiet gallery wall. The home is an empty table where each Figma frame sits as a card;
     opening one puts that frame full-width in a scroll stage, arrows step frame to frame. */
  :root {
    --bg: #ecebe8;
    --surface: #f6f5f2;
    --ink: #232323;
    --muted: #6f6d68;
    --line: #d6d4cf;
    --accent: #7300ff;
    --stage: #e3e2de;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --surface: #1d1d1b; --ink: #ecebe8; --muted: #9a9892;
      --line: #2e2d2a; --accent: #a56bff; --stage: #0e0e0d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --surface: #1d1d1b; --ink: #ecebe8; --muted: #9a9892;
    --line: #2e2d2a; --accent: #a56bff; --stage: #0e0e0d; color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  .stage:focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Home ---------- */
  .home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
    box-sizing: border-box;
    gap: 56px;
  }
  .home-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .home-head h1 {
    margin: 0;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .home-head h1 span { color: var(--muted); }
  .wall {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 420px));
    gap: 40px 32px;
    align-content: start;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .card-frame {
    position: relative;
    width: 100%;
    max-width: 100%;
    background: var(--surface);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.04);
    transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s;
  }
  .card-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }
  .card:hover .card-frame,
  .card:focus-visible .card-frame {
    transform: translateY(-4px);
    box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgb(0 0 0 / 0.35);
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .card-frame { outline: 2px solid var(--accent); outline-offset: 4px; }
  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .card-title { font-size: 19px; letter-spacing: -0.01em; }
  .home-foot { display: flex; gap: 20px; flex-wrap: wrap; }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 4px;
    color: var(--ink);
  }

  /* ---------- Viewer ---------- */
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    background: var(--stage);
  }
  .bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .bar-title {
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    text-align: center;
  }
  .bar-left { display: flex; justify-content: flex-start; min-width: 0; }
  .bar-right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn svg { width: 14px; height: 14px; }
  .count { padding: 0 6px; }

  .stage {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
  }
  .stage-inner {
    container-type: inline-size;
    width: min(100%, var(--frame-w, 1920px));
    margin: 0 auto;
    box-sizing: border-box;
    padding: clamp(0px, 2vw, 32px);
    padding-bottom: 64px;
  }
  .stage-inner img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 1.05cqw;
    box-shadow: 0 30px 80px -40px rgb(0 0 0 / 0.35);
    background: var(--surface);
  }
  .stage-end {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 28px;
  }
  .viewer.enter .stage-inner { animation: rise 0.45s cubic-bezier(.2,.7,.2,1); }
  @keyframes rise { from { opacity: 0.4; transform: translateY(12px); } }

  @media (max-width: 560px) {
    .bar { grid-template-columns: auto 1fr auto; }
    .back-text { display: none; }
    .stage-inner { padding: 0 0 48px; }
    .stage-inner img { border-radius: 0; }
    .stage-end { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card-frame, .viewer.enter .stage-inner { transition: none; animation: none; }
    .stage { scroll-behavior: auto; }
  }
</style>

<main class="home" id="home">
  <header class="home-head">
    <h1>Percepta <span>/ Brand concepts</span></h1>
    <span class="label" id="home-count"></span>
  </header>
  <ul class="wall" id="wall"></ul>
  <footer class="home-foot label">
    <span><kbd>←</kbd><kbd>→</kbd>Move</span>
    <span><kbd>Enter</kbd>Open</span>
    <span><kbd>Esc</kbd>Back to all</span>
  </footer>
</main>

<section class="viewer" id="viewer" hidden aria-label="Concept viewer">
  <div class="bar">
    <div class="bar-left">
      <button class="btn" id="back" type="button" aria-label="Back to all concepts">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>
        <span class="back-text">All concepts</span>
      </button>
    </div>
    <div class="bar-title" id="v-title"></div>
    <div class="bar-right">
      <button class="btn icon" id="prev" type="button" aria-label="Previous concept">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3 5 8l5 5"/></svg>
      </button>
      <span class="label count" id="v-count"></span>
      <button class="btn icon" id="next" type="button" aria-label="Next concept">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 3 5 5-5 5"/></svg>
      </button>
    </div>
  </div>
  <div class="stage" id="stage" tabindex="-1">
    <div class="stage-inner" id="stage-inner">
      <img id="v-img" alt="">
      <div class="stage-end">
        <span class="label" id="v-source"></span>
        <button class="btn" id="end-next" type="button"></button>
      </div>
    </div>
  </div>
</section>

<script>
  // Each entry is one Figma frame. Add more here as concepts are exported.
  const FRAMES = [
    {
      id: "benefits-and-perks",
      title: "Benefits and Perks",
      src: "frames/01-benefits-and-perks.jpg",
      thumb: "frames/01-benefits-and-perks-thumb.jpg",
      w: 1920, h: 1371,
      node: "4916:25309"
    }
  ];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const home = $("home"), viewer = $("viewer"), stage = $("stage");
  let current = -1;

  // Home wall
  $("home-count").textContent = `${pad(FRAMES.length)} ${FRAMES.length === 1 ? "frame" : "frames"}`;
  FRAMES.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <button class="card" type="button" data-i="${i}">
        <div class="card-frame" style="aspect-ratio:${f.w}/${f.h}">
          <img src="${f.thumb}" alt="" loading="lazy">
        </div>
        <div class="card-meta">
          <span class="card-title">${f.title}</span>
          <span class="label">${pad(i + 1)}</span>
        </div>
      </button>`;
    $("wall").appendChild(li);
  });
  const cards = [...document.querySelectorAll(".card")];
  cards.forEach((c) => c.addEventListener("click", () => go(+c.dataset.i)));

  function go(i) {
    location.hash = FRAMES[i].id;
  }

  function show(i) {
    const f = FRAMES[i];
    const entering = viewer.hidden;
    current = i;
    $("v-img").src = f.src;
    $("v-img").width = f.w;
    $("v-img").height = f.h;
    $("v-img").alt = `${f.title} concept`;
    $("stage-inner").style.setProperty("--frame-w", f.w + 64 + "px");
    $("v-title").textContent = f.title;
    $("v-count").textContent = `${pad(i + 1)} / ${pad(FRAMES.length)}`;
    $("v-source").textContent = `Figma frame ${f.node}`;
    $("prev").disabled = i === 0;
    $("next").disabled = i === FRAMES.length - 1;
    const last = i === FRAMES.length - 1;
    $("end-next").textContent = last ? "Back to all concepts" : `Next: ${FRAMES[i + 1].title} →`;
    document.title = `${f.title} · Percepta Concepts`;
    home.hidden = true;
    viewer.hidden = false;
    viewer.classList.remove("enter");
    void viewer.offsetWidth;
    viewer.classList.add("enter");
    stage.style.scrollBehavior = "auto";
    stage.scrollTop = 0;
    stage.style.scrollBehavior = "";
    stage.focus({ preventScroll: true });
    if (entering) cards[i]?.blur();
  }

  function showHome() {
    const was = current;
    current = -1;
    viewer.hidden = true;
    home.hidden = false;
    document.title = "Percepta Concepts";
    (cards[was] || cards[0])?.focus({ preventScroll: true });
  }

  function route() {
    const i = FRAMES.findIndex((f) => f.id === location.hash.slice(1));
    i >= 0 ? show(i) : showHome();
  }

  function closeViewer() {
    if (location.hash) history.pushState(null, "", location.pathname + location.search);
    showHome();
  }

  $("back").addEventListener("click", closeViewer);
  $("prev").addEventListener("click", () => current > 0 && go(current - 1));
  $("next").addEventListener("click", () => current < FRAMES.length - 1 && go(current + 1));
  $("end-next").addEventListener("click", () =>
    current < FRAMES.length - 1 ? go(current + 1) : closeViewer());

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (!viewer.hidden) {
      if (e.key === "ArrowRight" && current < FRAMES.length - 1) { e.preventDefault(); go(current + 1); }
      else if (e.key === "ArrowLeft" && current > 0) { e.preventDefault(); go(current - 1); }
      else if (e.key === "Escape") { e.preventDefault(); closeViewer(); }
      else if (e.key === " " || e.key === "PageDown" || e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "PageUp") {
        if (document.activeElement !== stage) stage.focus({ preventScroll: true });
      }
      return;
    }
    const at = cards.indexOf(document.activeElement);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const step = e.key === "ArrowRight" ? 1 : -1;
      const n = at < 0 ? 0 : Math.min(cards.length - 1, Math.max(0, at + step));
      cards[n].focus();
    } else if (e.key === "Enter" && at < 0) {
      go(0);
    }
  });

  window.addEventListener("hashchange", route);
  route();
</script>
