  @property --sweep { syntax: "<percentage>"; inherits: false; initial-value: 100%; }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Home ---------- */
  .home {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
    box-sizing: border-box;
    gap: 56px;
  }
  .home-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .home-head h1 { margin: 0; font-weight: 400; font-size: 22px; letter-spacing: -0.01em; }
  .home-head h1 span { color: var(--muted); }
  .wall {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 460px));
    gap: 40px 32px;
    align-content: start;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    text-align: left;
    cursor: none;
  }
  .card-frame {
    position: relative;
    width: 100%;
    max-width: 100%;
    background: #f4f4f4;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgb(0 0 0 / 0.04);
    transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  }
  .card-frame .mini {
    position: absolute;
    top: 0;
    left: 0;
    width: 1920px;
    transform-origin: 0 0;
    transform: scale(var(--s, 0.2));
    pointer-events: none;
  }
  .card-frame .mini.gray { filter: grayscale(1); }
  .card-frame .mini.color { clip-path: inset(0 100% 100% 0); }
  .mini .pf-media .gray { filter: none; }
  .card:hover .card-frame,
  .card:focus-visible .card-frame {
    transform: translateY(-6px);
    box-shadow: 0 0 0 1px var(--line), 0 24px 50px -22px rgb(0 0 0 / 0.4);
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .card-frame { outline: 2px solid var(--accent); outline-offset: 4px; }
  .card-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .card-title { font-size: 19px; letter-spacing: -0.01em; }
  .card-title em { color: var(--muted); font-style: italic; }
  .cursor {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 30;
    pointer-events: none;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.35s var(--ease-out);
    white-space: nowrap;
  }
  .cursor.on { transform: translate(-50%, -50%) scale(1); }
  @media (hover: none) { .card { cursor: pointer; } .cursor { display: none; } }
  .home-foot { display: flex; gap: 20px; flex-wrap: wrap; }
  kbd {
    font-family: var(--mono);
    font-size: 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 4px;
    color: var(--ink);
  }

  /* ---------- Viewer ---------- */
  .viewer { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--stage); }
  .bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .progress {
    position: absolute;
    left: 0;
    bottom: -1px;
    height: 1px;
    width: 100%;
    background: var(--ink);
    transform-origin: 0 50%;
    transform: scaleX(var(--p, 0));
  }
  .bar-title { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: center; }
  .bar-left { display: flex; justify-content: flex-start; min-width: 0; }
  .bar-right { display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.icon { width: 32px; padding: 0; justify-content: center; }
  .btn svg { width: 14px; height: 14px; }
  .count { padding: 0 6px; }

  .stage { flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
  .stage:focus { outline: none; }
  .stage-inner {
    width: min(100%, 1984px);
    margin: 0 auto;
    box-sizing: border-box;
    padding: clamp(0px, 2vw, 32px);
    padding-bottom: 120px;
  }
  .stage-end { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 28px; }
  @media (max-width: 560px) {
    .bar { grid-template-columns: auto 1fr auto; }
    .back-text { display: none; }

    }));

    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    const placeRest = () => {
      right.forEach((s, r) => { s.strips[0].style.transform = restTransform(0, r); });
      left.forEach((s, r) => { s.strips[0].style.transform = restTransform(1, r); });
    };
    const flatten = (s) => {
      for (let k = 1; k < s.strips.length; k++) s.strips[k].style.transform = "";
      s.shades.forEach((sh) => { sh.style.opacity = 0; });

      const s = right.shift();
      const under = left.pop();
      flatten(under);

      const rect = pf.getBoundingClientRect();
      const u = Math.max(0.35, rect.width / 1920);
      // Scatter runs continuously; only what is drawn is held frame to frame.
      for (const s of sqs) {
        let tx = 0, ty = 0;
        if (ptr && CFG.pxForce > 0) {
          const b = s.el.getBoundingClientRect();
          const cx = b.left + b.width / 2 - s.dx0, cy = b.top + b.height / 2 - s.dy0;
          const dx = cx - ptr[0], dy = cy - ptr[1], d = Math.hypot(dx, dy), R = CFG.pxRadius * u;
          if (d < R) {
            const f = Math.pow(1 - d / R, 1.6) * R * 0.55 * CFG.pxForce;
            const a = d > 0.5 ? Math.atan2(dy, dx) : s.ph;
            tx = Math.cos(a + (hash(s.k, 3) - 0.5) * 0.8) * f;
            ty = Math.sin(a + (hash(s.k, 3) - 0.5) * 0.8) * f;
          }
        }
        const k = 1 - Math.pow(1 - (tx || ty ? 0.25 : CFG.pxReturn * 0.12), dt / 16.7);
        s.sx += (tx - s.sx) * k; s.sy += (ty - s.sy) * k;
      }
      const i = Math.floor(((now - t0) / 1000) * CFG.pxFps);
      if (i !== shown || reduced) {
        shown = i;
        const tt = i / Math.max(1, CFG.pxFps);
        for (const s of sqs) {
          const size = s.el.offsetWidth || 20, j = reduced ? 0 : CFG.pxJitter * size * 0.2;
          const jx = (hash(s.k * 13 + 1, i) - 0.5) * 2 * j, jy = (hash(s.k * 7 + 5, i * 3 + 1) - 0.5) * 2 * j;
          const amp = reduced ? 0 : CFG.pxDrift * 18 * u;
          const drx = Math.cos(tt * 0.5 + s.ph) * amp, dry = Math.sin(tt * 0.7 + s.ph * 1.3) * amp * 1.4;
          const x = Math.round(s.sx + jx + drx), y = Math.round(s.sy + jy + dry);
          s.dx0 = x; s.dy0 = y;
          s.el.style.transform = `translate(${x}px, ${y}px)`;
        }
      }
      requestAnimationFrame(loop);
    };
    sqs.forEach((s) => { s.dx0 = 0; s.dy0 = 0; });
    requestAnimationFrame(loop);
    off.push(() => { alive = false; });
  }

  const FRAMES = [
    {
      id: "benefits-and-perks",
      title: "Benefits and Perks",
      tag: "Careers",
      node: "4916:25309",
      w: 1920, h: 1371,
      render() {
        const items = [
          ["Competitive salary and equity", "Top of the market compensation and meaningful equity.", "benefits-salary.jpg", 390],
          ["Health, Vision and Dental insurance", "Covered for you and your family.", "benefits-health.jpg", 562],
          ["Visa sponsorship", "We want to hire the best talent in the world.", "benefits-visa.jpg", 390],
          ["Parental and family benefits", "20 weeks of paid leave, family forming benefits, genetic testing, and more.", "benefits-family.jpg", 562],
        ];
        return `
          <div class="pf">
            ${NAV}
            <div class="pf-hero">
              <h2 class="pf-h1" data-rv="title">Benefits and Perks</h2>
              <p class="pf-intro" data-rv="section">We’re a startup, but our relationship with General Catalyst means that we enjoy the same benefits and resources typically only available to mature organizations.</p>
            </div>
            <div class="pf-grid">
              ${items.map(([t, d, src, h], i) => `
                <article class="pf-item" data-rv="section">
                  <div class="pf-num"><span>${String(i + 1).padStart(2, "0")}</span><span>→</span></div>
                  <div class="pf-media" style="--h:${h}">
                    <div class="pf-media-in">
                      <img class="gray" src="frames/${src}" alt="${t}" draggable="false">
                      <canvas aria-hidden="true"></canvas>
                    </div>
                  </div>
                  <h3 class="pf-title">${t}</h3>
                  <p class="pf-desc">${d}</p>
                </article>`).join("")}
            </div>
            ${squaresHTML(SQUARES)}
            <div class="pf-noise"></div>
          </div>`;
      },
      mount(root, stage) {
        const pf = root.querySelector(".pf");
        const off = [];
        const on = (el, ev, fn, o) => { el.addEventListener(ev, fn, o); off.push(() => el.removeEventListener(ev, fn, o)); };

        mountNav(pf, on, off);

        // Pixel reveal on each photo
        const local = (media, e) => {
          const r = media.getBoundingClientRect();
          return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
        };
        const reveals = [...pf.querySelectorAll(".pf-item")].map((it) => {
          const media = it.querySelector(".pf-media");
          const pr = new PixelReveal(media);
          on(it, "pointerenter", (e) => { if (e.pointerType !== "touch") pr.enter(...local(media, e)); });
          on(it, "pointerleave", (e) => { if (e.pointerType !== "touch") pr.leave(...local(media, e)); });
          return [it, pr];
        });
        if (matchMedia("(hover: none)").matches) {
          const lit = new IntersectionObserver((es) => es.forEach((en) => {
            const pr = reveals.find(([it]) => it === en.target)[1];
            en.target.classList.toggle("is-lit", en.isIntersecting);
            en.isIntersecting ? pr.enter(0.5, 0.5) : pr.leave(0.5, 0.5);
          }), { root: stage, rootMargin: "-35% 0px -35% 0px" });
          reveals.forEach(([it]) => lit.observe(it));
          off.push(() => lit.disconnect());
        }

        mountSquares(pf, on, off);
        return () => off.forEach((f) => f());
      },
    },
    {
      id: "industries",
      title: "Industries we embed in",
      tag: "Notebook",
      node: "4922:39957",
      w: 1920, h: 1253,
      render(o = {}) {
        const S = o.mini ? 1 : Math.round(CFG.nbStrips);
        const front = `<div class="nb-page nb-front">
            <p>[What we do ]</p>
            <div class="nb-body">
              <p>We help state governments deliver faster, more transparent services to citizens by replacing manual, years-long permitting and licensing processes with intelligent, self-service experiences.</p>
              <p>We embed directly within agencies to build AI-powered tools that streamline intake, surface dependencies, and bring clarity to processes that have been opaque for decades.</p>
            </div>
          </div>`;
        const back = `<div class="nb-page nb-back">
            <svg class="nb-mark" viewBox="0 0 32 40" aria-hidden="true"><path fill="#272727" d="M8 40H0V32H8V40ZM32 32H8V24H24V8H32V32ZM8 24H0V16H8V24ZM24 8H0V0H24V8Z"/></svg>
            <img class="nb-photo" src="frames/industries-photo.webp" alt="" draggable="false">
          </div>`;
        // A sheet is a chain of vertical strips, each hinged on the one before it, so the paper can bend.
        const sheet = (i) => {
          let inner = "";
          for (let k = S - 1; k >= 0; k--) {
            const w = 474 / S;
            inner = `<div class="nb-strip s${k}">
                <div class="nb-face front"><div style="position:absolute;inset:0;transform:translateX(calc(var(--nu) * ${-k * w}))">${front}</div><i></i></div>
                <div class="nb-face back"><div style="position:absolute;inset:0;transform:translateX(calc(var(--nu) * ${-(S - 1 - k) * w}))">${back}</div><i></i></div>
                ${inner}
              </div>`;
          }
          const [side, r] = i < 4 ? [0, i] : [1, i - 4];
          return `<div class="nb-sheet" data-i="${i}" style="--S:${S}">${inner.replace('class="nb-strip s0"',
            `class="nb-strip s0" style="transform:${restTransform(side, r)}"`)}</div>`;
        };
        const ring = `<svg viewBox="0 0 72 21"><rect width="14" height="21" fill="#272727"/><rect x="58" width="14" height="21" fill="#272727"/>
            <path transform="translate(-3.85 -1.6)" d="M72.6 1.6C72.6 4.58791 71.3721 7.49254 68.5854 8.57048C62.3477 10.9833 51.0168 12.5201 39.8308 12.6H39.3692C28.1832 12.5201 16.8523 10.9833 10.6146 8.57048C7.82792 7.49254 6.6 4.58791 6.6 1.6" stroke-width="4" stroke="url(#nb-wire)" fill="none"/>
            <path transform="translate(-3.85 7.4)" d="M72.6 1.6C72.6 4.58791 71.3721 7.49254 68.5854 8.57048C62.3477 10.9833 51.0168 12.5201 39.8308 12.6H39.3692C28.1832 12.5201 16.8523 10.9833 10.6146 8.57048C7.82792 7.49254 6.6 4.58791 6.6 1.6" stroke-width="4" stroke="url(#nb-wire)" fill="none"/></svg>`;
        return `
          <div class="pf pf2">
            ${NAV}
            <h2 class="i-h1" data-rv="title">Industries we embed in</h2>
            <p class="i-intro" data-rv="section">Over the last year, Percepta has been quietly at work — creating transformative outcomes for global Fortune 500 customers, state governments, and a significant part of the US healthcare ecosystem.</p>
            <div class="nb-wrap" data-rv="section">
              <div class="nb-shadow"><i></i><i></i></div>
              <div class="nb-book" style="--persp:${CFG.nbPersp}">
                ${Array.from({ length: 8 }, (_, i) => sheet(i)).join("")}
                <div class="nb-cast r"></div><div class="nb-cast l"></div>
              </div>
              <div class="nb-rings">${Array.from({ length: 9 }, (_, k) =>
                ring.replace("<svg ", `<svg style="top:${((2 + 61 * k) / 510 * 100).toFixed(3)}%" `)).join("")}</div>
              <div class="nb-tabs">${TABS.map(([label, top, h, c], i) =>
                `<span class="nb-tab${i === 0 ? " is-on" : ""}" data-tab="${i}" style="top:calc(var(--nu) * ${top});height:calc(var(--nu) * ${h});--tc:${c};z-index:${4 - i}">${label}</span>`).join("")}</div>
            </div>
            ${squaresHTML(SQUARES2)}
            <div class="pf-noise"></div>
          </div>`;
      },
      mount(root, stage) {
        const pf = root.querySelector(".pf");
        const off = [];
        const on = (el, ev, fn, o) => { el.addEventListener(ev, fn, o); off.push(() => el.removeEventListener(ev, fn, o)); };
        mountNav(pf, on, off);
        mountSquares(pf, on, off);
        off.push(mountNotebook(pf, on));
        return () => off.forEach((f) => f());
      },
    },
  ];

  // ---------- Entrance: title first, then sections; each goes blur → sharp, swept left to right ----------
  let entryAnims = [];
  function playEntrance(pf) {
    entryAnims.forEach((a) => a.cancel());
    entryAnims = [];
    const run = (el, delay) => {
      el.classList.add("rv");
      el.classList.remove("done");
      el.style.setProperty("--soft", CFG.soft + "%");
      const a = el.animate(
        [{ "--sweep": `-${CFG.soft + 5}%`, filter: `blur(${CFG.blur}px)`, opacity: 0, transform: "translateX(-12px)" },
         { "--sweep": "100%", filter: "blur(0px)", opacity: 1, transform: "none" }],
        { duration: reduced ? 1 : CFG.entryMs, delay: reduced ? 0 : delay, easing: "cubic-bezier(.16,1,.3,1)", fill: "both" });
      a.onfinish = () => { el.classList.add("done"); a.cancel(); };
      entryAnims.push(a);
    };
    pf.querySelectorAll('[data-rv="title"]').forEach((el, i) => run(el, i * CFG.stagger * 0.5));
    pf.querySelectorAll('[data-rv="section"]').forEach((el, i) => {
      const d = CFG.sectionDelay + i * CFG.stagger;
      if (el.classList.contains("pf-item")) {
        // Inside a card: number, photo, title and text follow each other closely.
        [...el.children].forEach((ch, j) => run(ch, d + j * CFG.stagger * 0.35));
      } else run(el, d);
    });
    pf.querySelectorAll(".pf-sq i").forEach((el, k) => {
      entryAnims.push(el.animate([{ opacity: 0, transform: "scale(0.2)" }, { opacity: 1, transform: "none" }],
        { duration: reduced ? 1 : 600, delay: reduced ? 0 : CFG.sectionDelay + 5 * CFG.stagger + k * 45, easing: "cubic-bezier(.16,1,.3,1)", fill: "both" }));
    });
  }

  function applyCfg(pf) {
    if (!pf) return;
    pf.style.setProperty("--grow", CFG.grow);
    pf.classList.toggle("field-full", CFG.pxField === "full");
    pf.style.setProperty("--grow-ms", CFG.growMs + "ms");
    pf.style.setProperty("--zoom", CFG.zoom);
    pf.style.setProperty("--ps", CFG.pxSize);
  }

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const home = $("home"), viewer = $("viewer"), stage = $("stage"), cursor = $("cursor");
  let current = -1, unmount = null;

  // ---------- Home wall: live miniatures, grey until hovered (same pixel reveal, as a clip-path) ----------
  $("home-count").textContent = `${pad(FRAMES.length)} ${FRAMES.length === 1 ? "frame" : "frames"}`;
  FRAMES.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `
      <button class="card" type="button" data-i="${i}" aria-label="Open ${f.title}">
        <div class="card-frame" style="aspect-ratio:1920/1371">
          <div class="mini gray"><div class="pf-wrap">${f.render({ mini: true })}</div></div>
          <div class="mini color"><div class="pf-wrap">${f.render({ mini: true })}</div></div>
        </div>
        <div class="card-meta">
          <span class="card-title">${f.title} <em>· ${f.tag}</em></span>
          <span class="label">${pad(i + 1)}</span>
        </div>
      </button>`;
    $("wall").appendChild(li);
  });
  const cards = [...document.querySelectorAll(".card")];
  const fit = new ResizeObserver((es) => es.forEach((en) => en.target.style.setProperty("--s", en.contentRect.width / 1920)));

  function miniReveal(card) {
    const frame = card.querySelector(".card-frame"), layer = card.querySelector(".mini.color");
    let p = 0, dir = 0, origin = [0.5, 0.5], raf = 0, last = 0;
    const draw = () => {
      const end = 1 + CFG.band * 0.5;
      if (p <= 0) { layer.style.clipPath = ""; return; }
      if (p >= end) { layer.style.clipPath = "none"; return; }
      const scale = frame.clientWidth / 1920, cs = CFG.pixel / scale;
      const H = frame.clientHeight / scale, cols = Math.ceil(1920 / cs), rows = Math.ceil(H / cs);
      const oc = origin[0] * cols, or = origin[1] * rows, q = cs.toFixed(1);
      let d = "";
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        if (cellTime(c, r, cols, rows, oc, or) <= p) d += `M${(c * cs).toFixed(1)} ${(r * cs).toFixed(1)}h${q}v${q}h-${q}z`;
      }
      layer.style.clipPath = d ? `path("${d}")` : "";
    };
    const tick = (now) => {
      const end = 1 + CFG.band * 0.5;
      p = reduced ? (dir > 0 ? end : 0) : Math.min(end, Math.max(0, p + ((now - last) / CFG.revealMs) * end * dir));
      last = now;
      draw();
      raf = (dir > 0 && p < end) || (dir < 0 && p > 0) ? requestAnimationFrame(tick) : 0;
    };
    const start = (e, d) => {
      const r = frame.getBoundingClientRect();
      origin = [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
      dir = d;
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    };
    return { enter: (e) => start(e, 1), leave: (e) => start(e, -1) };
  }

  cards.forEach((c) => {
    fit.observe(c.querySelector(".card-frame"));
    const mr = miniReveal(c);
    c.addEventListener("click", () => go(+c.dataset.i));
    c.addEventListener("pointerenter", (e) => { mr.enter(e); cursor.classList.add("on"); });
    c.addEventListener("pointerleave", (e) => { mr.leave(e); cursor.classList.remove("on"); });
  });
  addEventListener("pointermove", (e) => { cursor.style.left = e.clientX + "px"; cursor.style.top = e.clientY + "px"; });

  // ---------- Viewer ----------
  function go(i) { location.hash = FRAMES[i].id; }
  const livePf = () => $("v-frame").querySelector(".pf");

  function show(i) {
    const f = FRAMES[i];
    current = i;
    cursor.classList.remove("on");
    unmount?.();
    const holder = $("v-frame");
    holder.innerHTML = `<div class="pf-wrap">${f.render()}</div>`;
    const pf = holder.querySelector(".pf");
    applyCfg(pf);
    unmount = f.mount?.(holder, stage) || null;

    $("v-title").textContent = f.title;
    $("v-count").textContent = `${pad(i + 1)} / ${pad(FRAMES.length)}`;
    $("v-source").textContent = `Figma frame ${f.node}`;
    $("prev").disabled = i === 0;
    $("next").disabled = i === FRAMES.length - 1;
    const last = i === FRAMES.length - 1;
    $("end-next").textContent = last ? "Back to all concepts" : `Next: ${FRAMES[i + 1].title} →`;
    document.title = `${f.title} · Percepta Concepts`;
    home.hidden = true;
    viewer.hidden = false;
    stage.scrollTop = 0;
    progress();
    stage.focus({ preventScroll: true });
    if (!panel.hidden) buildPanel();
    playEntrance(pf);
  }

  function showHome() {
    const was = current;
    current = -1;
    unmount?.(); unmount = null;
    entryAnims.forEach((a) => a.cancel()); entryAnims = [];
    viewer.hidden = true;
    home.hidden = false;
    $("v-frame").innerHTML = "";
    document.title = "Percepta Concepts";
    if (was >= 0) cards[was]?.focus({ preventScroll: true });
  }

  function route() {
    const i = FRAMES.findIndex((f) => f.id === location.hash.slice(1));
    i >= 0 ? show(i) : showHome();
  }
  function closeViewer() {
    if (location.hash) history.pushState(null, "", location.pathname + location.search);
    showHome();
  }
  function progress() {
    const max = stage.scrollHeight - stage.clientHeight;
    $("progress").style.setProperty("--p", max > 0 ? stage.scrollTop / max : 1);
  }
  stage.addEventListener("scroll", progress, { passive: true });

  $("back").addEventListener("click", closeViewer);
  $("prev").addEventListener("click", () => current > 0 && go(current - 1));
  $("next").addEventListener("click", () => current < FRAMES.length - 1 && go(current + 1));
  $("end-next").addEventListener("click", () => current < FRAMES.length - 1 ? go(current + 1) : closeViewer());

  // ---------- Parameters panel ----------
  const panel = $("tune-panel"), tune = $("tune"), toggle = $("tune-toggle");
  const ITEMS = Object.fromEntries(SCHEMA.flatMap(([, items]) => items.map((it) => [it.k, it])));
  const fmt = (it, v) => it.unit === "×" ? `${(+v).toFixed(it.step < 0.01 ? 3 : 1)}×` : it.unit ? `${v}${it.unit}` : (+v).toFixed(2);
  let replayTimer = 0;
  function buildPanel() {
    const id = FRAMES[current]?.id;
    panel.innerHTML = SCHEMA.filter(([, , only]) => !only || only.includes(id)).map(([group, items]) => `
      <div class="tune-group"><h4>${group}</h4>
        ${items.map((it) => {
          const id = "p-" + it.k;
          if (it.options) return `<div class="tune-row"><label for="${id}">${it.label}</label>
            <select id="${id}" data-k="${it.k}">${it.options.map(([v, l]) => `<option value="${v}"${CFG[it.k] === v ? " selected" : ""}>${l}</option>`).join("")}</select></div>`;
          if (it.toggle) return `<div class="tune-row"><label for="${id}">${it.label}</label>
            <input id="${id}" type="checkbox" data-k="${it.k}"${CFG[it.k] ? " checked" : ""}></div>`;
          return `<div class="tune-row"><label for="${id}">${it.label}</label>
            <input id="${id}" type="range" data-k="${it.k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${CFG[it.k]}">
            <output for="${id}">${fmt(it, CFG[it.k])}</output></div>`;
        }).join("")}
      </div>`).join("") + `
      <div class="tune-actions">
        <button class="btn" type="button" data-act="replay">Replay entrance</button>
        <button class="btn" type="button" data-act="copy">Copy values</button>
        <button class="btn" type="button" data-act="reset">Reset</button>
      </div>
      <p class="tune-note" id="tune-note" aria-live="polite"></p>
      <textarea class="tune-copy" id="tune-copy" hidden readonly></textarea>`;
  }
  panel.addEventListener("input", (e) => {
    const el = e.target, k = el.dataset.k;
    if (!k) return;
    const it = ITEMS[k];
    CFG[k] = it.toggle ? el.checked : it.options ? el.value : +el.value;
    if (el.nextElementSibling?.tagName === "OUTPUT") el.nextElementSibling.textContent = fmt(it, CFG[k]);
    saveCfg();
    applyCfg(livePf());
    if (k === "nbPersp") livePf()?.querySelector(".nb-book")?.style.setProperty("--persp", CFG[k]);
    if (k === "nbStrips") { clearTimeout(replayTimer); replayTimer = setTimeout(() => show(current, { keepPanel: true }), 300); }
    if (["blur", "entryMs", "stagger", "sectionDelay", "soft"].includes(k)) {
      clearTimeout(replayTimer);
      replayTimer = setTimeout(() => livePf() && playEntrance(livePf()), 450);
    }
  });
  panel.addEventListener("click", async (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "replay") { stage.scrollTop = 0; livePf() && playEntrance(livePf()); }
    if (act === "reset") {
      CFG = { ...DEFAULTS }; saveCfg(); buildPanel(); applyCfg(livePf());
      livePf() && playEntrance(livePf());
      $("tune-note").textContent = "Back to defaults.";
    }
    if (act === "copy") {
      const text = JSON.stringify(CFG, null, 2);
      try { await navigator.clipboard.writeText(text); $("tune-note").textContent = "Copied to clipboard."; }
      catch (err) {
        const ta = $("tune-copy");
        ta.hidden = false; ta.value = text; ta.select();
        $("tune-note").textContent = "Select and copy the values below.";
      }
    }
  });
  toggle.addEventListener("click", () => {
    const open = panel.hidden;
    if (open) buildPanel();
    panel.hidden = !open;
    tune.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
  });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest?.("input, select, textarea")) return;
    if (!viewer.hidden) {
      if (e.key === "ArrowRight" && current < FRAMES.length - 1) { e.preventDefault(); go(current + 1); }
      else if (e.key === "ArrowLeft" && current > 0) { e.preventDefault(); go(current - 1); }
      else if (e.key === "Escape") {
        e.preventDefault();
        if (!panel.hidden) toggle.click(); else closeViewer();
      }
      else if ([" ", "PageDown", "PageUp", "ArrowDown", "ArrowUp"].includes(e.key) && document.activeElement !== stage) {
        if (!e.target.closest?.("button, [role=button]")) stage.focus({ preventScroll: true });
      }
      return;
    }
    const at = cards.indexOf(document.activeElement);
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const step = e.key === "ArrowRight" ? 1 : -1;
      cards[at < 0 ? 0 : Math.min(cards.length - 1, Math.max(0, at + step))].focus();
    } else if (e.key === "Enter" && at < 0) {
      go(0);
    }
  });

  addEventListener("hashchange", route);
  route();
</script>
